<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Singing Sands: Calendar</title>
<meta name="description" content="Boat-sharing schedule for the Pletzer and Salter families.">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0a1420">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Singing Sands">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="harbor-glow" aria-hidden="true"></div>

<header class="app-header">
  <div class="title-row">
    <svg class="mark" width="26" height="26" viewBox="4 28 94 62" aria-hidden="true"
         fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 42 L88 46 L84 59 L28 59 Z" stroke="var(--text)" stroke-width="4.6"/>
      <path d="M46 43.8 L56 33 L58 44.4" stroke="var(--text)" stroke-width="3.8"/>
      <path d="M75 45.2 L75 34 L86 34 L86 45.9" stroke="var(--text)" stroke-width="3.8"/>
      <path d="M8 71 Q18.5 77.8 29 71 T50 71 T71 71 T92 71" stroke="var(--pletzer)" stroke-width="4.6"/>
      <path d="M8 84 Q18.5 90.8 29 84 T50 84 T71 84 T92 84" stroke="var(--salter)" stroke-width="4.6"/>
    </svg>
    <h1>Singing Sands<span>: Calendar</span></h1>
  </div>

  <div class="wave-divider" aria-hidden="true">
    <svg viewBox="0 0 400 10" preserveAspectRatio="none">
      <path d="M0 5 Q 25 0, 50 5 T 100 5 T 150 5 T 200 5 T 250 5 T 300 5 T 350 5 T 400 5"
            fill="none" stroke="url(#waveGrad)" stroke-width="1.5"/>
      <defs>
        <linearGradient id="waveGrad" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--pletzer)"/>
          <stop offset="50%" stop-color="var(--amber)"/>
          <stop offset="100%" stop-color="var(--salter)"/>
        </linearGradient>
      </defs>
    </svg>
  </div>
</header>

<main>
  <div class="top-bar">
    <nav class="legend" aria-label="Family key">
      <span class="legend-item"><i class="swatch pletzer"></i>Pletzer</span>
      <span class="legend-item"><i class="swatch salter"></i>Salter</span>
    </nav>

    <div class="top-bar-right">
      <div class="view-toggle" role="group" aria-label="View mode">
        <button id="btnWeekView" class="toggle-btn active" data-view="week">Week</button>
        <button id="btnMonthView" class="toggle-btn" data-view="month">Month</button>
      </div>
      <button id="btnSettings" class="icon-btn" aria-label="Settings" title="Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 13a7.5 7.5 0 0 0 0-2l2-1.5-2-3.4-2.4.6a7.6 7.6 0 0 0-1.7-1L15 3h-4l-.3 2.7a7.6 7.6 0 0 0-1.7 1l-2.4-.6-2 3.4L6.6 11a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.4 2.4-.6a7.6 7.6 0 0 0 1.7 1L11 21h4l.3-2.7a7.6 7.6 0 0 0 1.7-1l2.4.6 2-3.4-2-1.5Z"/>
        </svg>
      </button>
    </div>
  </div>

  <div class="nav-row">
    <button id="btnToday" class="btn btn-today">Today</button>
    <div class="range-nav">
      <button id="btnPrev" class="btn-icon" aria-label="Previous">‹</button>
      <span id="rangeLabel" class="range-label">Loading…</span>
      <button id="btnNext" class="btn-icon" aria-label="Next">›</button>
    </div>
  </div>

  <section id="weekView" class="week-board"></section>

  <section id="monthView" class="month-grid" hidden>
    <div class="month-weekdays" id="monthWeekdays"></div>
    <div class="month-days" id="monthDays"></div>
  </section>

  <button id="installBtn" class="btn btn-install" hidden>⇩ Install app</button>
  <p id="iosHint" class="ios-hint" hidden>On iPhone/iPad: tap <strong>Share</strong> → <strong>Add to Home Screen</strong> to install.</p>
</main>

<!-- Settings panel -->
<div id="settingsOverlay" class="settings-overlay" hidden>
  <div class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
    <div class="settings-head">
      <h2 id="settingsTitle">Settings</h2>
      <button id="btnCloseSettings" class="icon-btn" aria-label="Close settings">✕</button>
    </div>
    <label class="settings-field">
      <span>Week starts on</span>
      <select id="weekStartSelect">
        <option value="0">Sunday</option>
        <option value="1">Monday</option>
        <option value="2">Tuesday</option>
        <option value="3">Wednesday</option>
        <option value="4">Thursday</option>
        <option value="5">Friday</option>
        <option value="6">Saturday</option>
      </select>
    </label>
    <p class="settings-note">Saved on this device only.</p>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
